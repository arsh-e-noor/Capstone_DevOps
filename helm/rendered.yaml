# Source: chat-app/templates/mongodb/deployment.yaml
apiVersion: apps/v1
kind: Deployment

metadata:
  name: mongodb
  namespace: chat-dev

spec:
  replicas: 1

  selector:
    matchLabels:
      app: mongodb

  template:
    metadata:
      labels:
        app: mongodb

    spec:
      containers:
        - name: mongodb

          image: mongo:6

          ports:
            - containerPort: 27017

          volumeMounts:
            - name: mongo-storage
              mountPath: /data/db

      volumes:
        - name: mongo-storage

          persistentVolumeClaim:
            claimName: mongodb-pvc
---
# Source: chat-app/templates/redis/deployment.yaml
apiVersion: apps/v1
kind: Deployment

metadata:
  name: redis
  namespace: chat-dev

spec:
  replicas: 1

  selector:
    matchLabels:
      app: redis

  template:
    metadata:
      labels:
        app: redis

    spec:
      containers:
        - name: redis

          image: redis:7

          ports:
            - containerPort: 6379

          volumeMounts:
            - name: redis-storage
              mountPath: /data

      volumes:
        - name: redis-storage

          persistentVolumeClaim:
            claimName: redis-pvc
