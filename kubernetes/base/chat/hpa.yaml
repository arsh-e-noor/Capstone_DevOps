apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: chat-hpa
  namespace: chat-dev

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chat-service

  minReplicas: 2
  maxReplicas: 5

  metrics:
    - type: Resource

      resource:
        name: cpu

        target:
          type: Utilization
          averageUtilization: 70